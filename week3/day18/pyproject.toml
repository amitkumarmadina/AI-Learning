[project]
name = "day18"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AMIT KUMAR MADINA", email = "amitkumarmadina9@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.4.6",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
day18 = "day18:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
